name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

env:
  VERSION: ${{ vars.MAJOR }}.${{ vars.MINOR }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Set RosBE cache scope
        run: echo "ROSBE_CACHE=$(gcc -march=native -Q --help=target | sha1sum | awk '{print $1}')" >> "$GITHUB_ENV"
      -
        name: Build artifacts
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          provenance: false
          outputs: type=local,dest=output
          platforms: linux/amd64
          cache-from: type=gha,scope=rosbe-${{ env.ROSBE_CACHE }}
          cache-to: type=gha,mode=max,scope=rosbe-${{ env.ROSBE_CACHE }}
          build-args: |
            VERSION_ARG=${{ env.VERSION }}
      -
        name: Upload unsigned artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qbochs-unsigned
          path: output/*
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign Server 2003
    needs: build
    runs-on: windows-2022
    permissions:
      actions: write
      contents: read
    steps:
      -
        name: Download unsigned artifacts
        uses: actions/download-artifact@v8
        with:
          name: qbochs-unsigned
          path: output
      -
        name: Restore Inf2Cat cache
        id: cache-inf2cat
        uses: actions/cache/restore@v6
        with:
          path: '${{ runner.temp }}\qbochs-inf2cat81'
          key: inf2cat-wdk81-8.100.25984.0-windows-2022-v2
      -
        name: Prepare Inf2Cat cache
        if: steps.cache-inf2cat.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          function Write-Step {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Message
            )

            Write-Host ("[{0:HH:mm:ss.fff}] {1}" -f (Get-Date), $Message)
          }

          $stageTimer = [System.Diagnostics.Stopwatch]::New()

          function Test-Inf2CatToolset {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Directory
            )

            foreach ($file in @(
              'Inf2Cat.exe',
              'inf2cat.exe.manifest',
              'Microsoft.Whos.Shared.IO.Cabinets.dll',
              'Microsoft.Whos.Shared.IO.Catalogs.dll',
              'Microsoft.Whos.Shared.Xml.InfReader.dll',
              'Microsoft.Whos.Winqual.Submissions.SubmissionBuilder.dll',
              'Microsoft.Whos.Xml.NonXmlDataReader.dll',
              'WindowsProtectedFiles.xml'
            )) {
              if (-not (Test-Path (Join-Path $Directory $file))) {
                Write-Step "Inf2Cat toolset is missing $file"
                return $false
              }
            }

            return $true
          }

          $inf2catCache = Join-Path $env:RUNNER_TEMP 'qbochs-inf2cat81'

          if (-not (Test-Inf2CatToolset -Directory $inf2catCache)) {
            Write-Step 'Inf2Cat cache miss; preparing it from the Windows Driver Kit 8.1 layout.'

            if (Test-Path $inf2catCache) {
              Remove-Item $inf2catCache -Recurse -Force
            }
            New-Item -ItemType Directory -Path $inf2catCache | Out-Null

            $wdkRoot = Join-Path $env:RUNNER_TEMP 'wdk81'
            $wdkLayout = Join-Path $wdkRoot 'layout'
            $wdkExtract = Join-Path $wdkRoot 'extract'
            $wdkSetup = Join-Path $wdkRoot 'wdksetup.exe'
            $wdkSetupUrl = 'https://download.microsoft.com/download/8/6/9/86925F0F-D57A-4BA4-8278-861B6876D78E/wdk/wdksetup.exe'

            if (Test-Path $wdkRoot) {
              Remove-Item $wdkRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Path $wdkRoot, $wdkLayout, $wdkExtract | Out-Null

            $stageTimer.Restart()
            Write-Step 'Downloading the Windows Driver Kit 8.1 bootstrapper.'
            Invoke-WebRequest `
              -Uri $wdkSetupUrl `
              -OutFile $wdkSetup `
              -UseBasicParsing
            Write-Step ("WDK bootstrapper downloaded in {0:N2}s." -f $stageTimer.Elapsed.TotalSeconds)

            $stageTimer.Restart()
            Write-Step 'Downloading the Windows Driver Kit 8.1 layout (cache miss only).'
            $layout = Start-Process `
              -FilePath $wdkSetup `
              -ArgumentList @(
                '/layout',
                "`"$wdkLayout`"",
                '/quiet',
                '/norestart'
              ) `
              -Wait `
              -PassThru

            if ($layout.ExitCode -ne 0) {
              throw "Windows Driver Kit 8.1 layout failed with exit code $($layout.ExitCode)."
            }
            Write-Step ("WDK 8.1 layout completed in {0:N2}s." -f $stageTimer.Elapsed.TotalSeconds)

            $msi = Get-ChildItem `
              -Path $wdkLayout `
              -Filter 'Windows Driver Kit-x86_en-us.msi' `
              -File `
              -Recurse |
              Select-Object -First 1

            if (-not $msi) {
              throw 'Windows Driver Kit 8.1 layout does not contain Windows Driver Kit-x86_en-us.msi.'
            }

            Write-Step "Using WDK package: $($msi.FullName)"

            $stageTimer.Restart()
            Write-Step 'Extracting the WDK driver tools without installing the WDK.'
            $adminInstall = Start-Process `
              -FilePath msiexec.exe `
              -ArgumentList @(
                '/a',
                "`"$($msi.FullName)`"",
                '/qn',
                "TARGETDIR=`"$wdkExtract`""
              ) `
              -Wait `
              -PassThru

            if ($adminInstall.ExitCode -ne 0) {
              throw "Windows Driver Kit 8.1 extraction failed with exit code $($adminInstall.ExitCode)."
            }
            Write-Step ("WDK driver-tools extraction completed in {0:N2}s." -f $stageTimer.Elapsed.TotalSeconds)

            $extractedInf2Cat = Get-ChildItem `
              -Path $wdkExtract `
              -Filter Inf2Cat.exe `
              -File `
              -Recurse |
              Select-Object -First 1

            if (-not $extractedInf2Cat) {
              throw 'Inf2Cat.exe was not found in the Windows Driver Kit 8.1 package.'
            }

            $inf2catDir = Split-Path -Parent $extractedInf2Cat.FullName
            Write-Step "Found Inf2Cat toolset at: $inf2catDir"
            Copy-Item (Join-Path $inf2catDir '*') $inf2catCache -Recurse -Force

            if (-not (Test-Inf2CatToolset -Directory $inf2catCache)) {
              throw 'Extracted Windows Driver Kit 8.1 Inf2Cat toolset is incomplete.'
            }

            Write-Step 'Inf2Cat toolset prepared for the Actions cache.'
          }
          else {
            Write-Step 'Using cached Windows Driver Kit 8.1 Inf2Cat toolset.'
          }

      -
        name: Save Inf2Cat cache
        if: steps.cache-inf2cat.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: '${{ runner.temp }}\qbochs-inf2cat81'
          key: inf2cat-wdk81-8.100.25984.0-windows-2022-v2
      -
        name: Create and sign Server 2003 catalogs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          function Write-Step {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Message
            )

            Write-Host ("[{0:HH:mm:ss.fff}] {1}" -f (Get-Date), $Message)
          }

          $overallTimer = [System.Diagnostics.Stopwatch]::StartNew()
          $stageTimer = [System.Diagnostics.Stopwatch]::New()

          $zip = Join-Path $PWD 'output\QBochs.zip'
          $signedRoot = Join-Path $PWD 'signed'
          $packageRoot = Join-Path $signedRoot 'package'

          if (-not (Test-Path $zip)) {
            throw "Missing build artifact: $zip"
          }

          if (Test-Path $signedRoot) {
            Remove-Item $signedRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $signedRoot | Out-Null

          Expand-Archive -Path $zip -DestinationPath $packageRoot -Force

          $driverDirs = @(
            (Join-Path $packageRoot '2k3\x86'),
            (Join-Path $packageRoot '2k3\x64')
          )

          foreach ($dir in $driverDirs) {
            $inf = Join-Path $dir 'qbochs.inf'
            $sys = Join-Path $dir 'qbochs.sys'

            if (-not (Test-Path $inf) -or -not (Test-Path $sys)) {
              throw "Incomplete Server 2003 driver package: $dir"
            }

            $text = Get-Content -Path $inf -Raw
            if ($text -notmatch '(?im)^\s*CatalogFile\s*=') {
              $text = $text -replace '(?m)^(DriverVer\s*=.*)$', "`$1`r`nCatalogFile = qbochs.cat"
              Set-Content -Path $inf -Value $text -Encoding ASCII
            }
          }

          $inf2catCache = Join-Path $env:RUNNER_TEMP 'qbochs-inf2cat81'
          foreach ($file in @(
            'Inf2Cat.exe',
            'inf2cat.exe.manifest',
            'Microsoft.Whos.Shared.IO.Cabinets.dll',
            'Microsoft.Whos.Shared.IO.Catalogs.dll',
            'Microsoft.Whos.Shared.Xml.InfReader.dll',
            'Microsoft.Whos.Winqual.Submissions.SubmissionBuilder.dll',
            'Microsoft.Whos.Xml.NonXmlDataReader.dll',
            'WindowsProtectedFiles.xml'
          )) {
            if (-not (Test-Path (Join-Path $inf2catCache $file))) {
              throw "Inf2Cat cache is incomplete: missing $file"
            }
          }

          $inf2cat = Join-Path $inf2catCache 'Inf2Cat.exe'
          Write-Step "Using Inf2Cat: $inf2cat"

          $catalogTargets = @(
            @{
              Name = 'Server 2003 x86'
              Directory = $driverDirs[0]
              Os = 'Server2003_X86'
            },
            @{
              Name = 'Server 2003 x64'
              Directory = $driverDirs[1]
              Os = 'Server2003_X64'
            }
          )

          foreach ($target in $catalogTargets) {
            $stageTimer.Restart()
            Write-Step "Generating $($target.Name) catalog."

            & $inf2cat `
              "/driver:$($target.Directory)" `
              "/os:$($target.Os)" `
              '/uselocaltime' `
              '/verbose'

            if ($LASTEXITCODE -ne 0) {
              throw "Inf2Cat failed for $($target.Name)."
            }

            $cat = Join-Path $target.Directory 'qbochs.cat'
            if (-not (Test-Path $cat)) {
              throw "Inf2Cat did not create $cat"
            }

            Write-Step (
              "{0} catalog generated in {1:N2}s: {2}" -f
                $target.Name,
                $stageTimer.Elapsed.TotalSeconds,
                $cat
            )
          }

          Write-Step 'Both catalogs are complete; starting certificate creation.'

          function Get-CertificateFromPersonalStore {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Thumbprint
            )

            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              'My',
              [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
            )

            try {
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadOnly)
              $matches = $store.Certificates.Find(
                [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                $Thumbprint,
                $false
              )

              foreach ($match in $matches) {
                if ($match.HasPrivateKey) {
                  return [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($match)
                }
              }

              return $null
            }
            finally {
              $store.Close()
            }
          }

          $certInf = Join-Path $env:RUNNER_TEMP 'qbochs-cert.inf'
          $cer = Join-Path $env:RUNNER_TEMP 'qbochs.cer'

          @'
          [Version]
          Signature="$Windows NT$"

          [NewRequest]
          Subject="CN=QBochs Project"
          KeyAlgorithm=RSA
          KeyLength=2048
          KeySpec=AT_SIGNATURE
          KeyUsage=0x80
          MachineKeySet=FALSE
          Exportable=FALSE
          ProviderName="Microsoft Enhanced RSA and AES Cryptographic Provider"
          ProviderType=24
          HashAlgorithm=sha1
          RequestType=Cert
          Silent=TRUE
          FriendlyName="QBochs Project"
          ValidityPeriod=Years
          ValidityPeriodUnits=20

          [Extensions]
          2.5.29.37="{text}"
          _continue_="1.3.6.1.5.5.7.3.3"
          '@ | Set-Content -Path $certInf -Encoding ASCII

          $stageTimer.Restart()
          Write-Step 'Creating QBochs RSA-2048/SHA1 code-signing certificate with certreq.exe.'
          & certreq.exe -new -q -user $certInf $cer
          if ($LASTEXITCODE -ne 0) {
            throw "certreq.exe failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path $cer)) {
            throw 'certreq.exe did not create qbochs.cer.'
          }

          $publicCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cer)
          $cert = Get-CertificateFromPersonalStore -Thumbprint $publicCert.Thumbprint

          if (-not $cert -or -not $cert.HasPrivateKey) {
            throw "The certreq certificate was not installed with its private key in CurrentUser\My."
          }

          if ($publicCert.SignatureAlgorithm.Value -ne '1.2.840.113549.1.1.5') {
            throw "The generated certificate is not signed with sha1RSA."
          }

          $hasCodeSigningEku = $false
          foreach ($extension in $publicCert.Extensions) {
            if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
              foreach ($oid in $extension.EnhancedKeyUsages) {
                if ($oid.Value -eq '1.3.6.1.5.5.7.3.3') {
                  $hasCodeSigningEku = $true
                }
              }
            }
          }
          if (-not $hasCodeSigningEku) {
            throw "The generated certificate does not contain the Code Signing EKU."
          }

          Write-Step (
            "Certificate created and installed in {0:N2}s; thumbprint {1}." -f
              $stageTimer.Elapsed.TotalSeconds,
              $cert.Thumbprint
          )

          Write-Step 'Skipping build-runner trust-store changes; the certificate is trusted only by the target OS.'

          Add-Type -AssemblyName System.Security

          function Test-CatalogSignature {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path,

              [Parameter(Mandatory = $true)]
              [string]$Thumbprint
            )

            $cms = New-Object System.Security.Cryptography.Pkcs.SignedCms
            $cms.Decode([System.IO.File]::ReadAllBytes($Path))

            # Verify the PKCS#7 signature itself, but deliberately do not build a
            # trust chain on the ephemeral GitHub runner.
            $cms.CheckSignature($true)

            if ($cms.SignerInfos.Count -ne 1) {
              throw "Expected exactly one signer in $Path, found $($cms.SignerInfos.Count)."
            }

            $signerInfo = $cms.SignerInfos[0]
            $signerCert = $signerInfo.Certificate
            if (-not $signerCert) {
              throw "Signed catalog does not contain its signer certificate: $Path"
            }

            if ($signerCert.Thumbprint -ne $Thumbprint) {
              throw "Catalog signer thumbprint does not match the certificate created for this build: $Path"
            }

            if ($signerInfo.DigestAlgorithm.Value -ne '1.3.14.3.2.26') {
              throw "Catalog was not signed with SHA1: $Path"
            }
          }

          function Find-SignTool {
            $fromPath = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($fromPath) {
              return $fromPath.Source
            }

            foreach ($root in @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
              "$env:ProgramFiles\Windows Kits\10\bin"
            )) {
              if (-not (Test-Path $root)) {
                continue
              }

              $versioned = Get-ChildItem `
                -Path (Join-Path $root '*\x64\signtool.exe') `
                -File `
                -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1

              if ($versioned) {
                return $versioned.FullName
              }

              $unversioned = Join-Path $root 'x64\signtool.exe'
              if (Test-Path $unversioned) {
                return $unversioned
              }
            }

            return $null
          }

          $stageTimer.Restart()
          Write-Step 'Locating SignTool without recursively scanning Windows Kits.'
          $signTool = Find-SignTool

          if (-not $signTool) {
            throw 'SignTool.exe was not found.'
          }

          Write-Step (
            "Using SignTool after {0:N2}s: {1}" -f
              $stageTimer.Elapsed.TotalSeconds,
              $signTool
          )

          foreach ($target in $catalogTargets) {
            $dir = $target.Directory
            $cat = Join-Path $dir 'qbochs.cat'
            $inf = Join-Path $dir 'qbochs.inf'
            $sys = Join-Path $dir 'qbochs.sys'

            $stageTimer.Restart()
            Write-Step "Signing $($target.Name) catalog."
            & $signTool sign /v /fd SHA1 /s My /sha1 $cert.Thumbprint $cat
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool failed to sign $cat"
            }
            Write-Step ("Signed $($target.Name) catalog in {0:N2}s." -f $stageTimer.Elapsed.TotalSeconds)

            $stageTimer.Restart()
            Write-Step "Cryptographically verifying $($target.Name) catalog signature without runner trust."
            Test-CatalogSignature -Path $cat -Thumbprint $cert.Thumbprint
            Write-Step ("Catalog signature verified in {0:N2}s." -f $stageTimer.Elapsed.TotalSeconds)

          }

          Write-Step 'Validating signed package contents.'
          foreach ($dir in $driverDirs) {
            foreach ($file in 'qbochs.inf', 'qbochs.sys', 'qbochs.cat') {
              if (-not (Test-Path (Join-Path $dir $file))) {
                throw "Signed package is missing $file in $dir"
              }
            }
          }

          foreach ($required in @(
            '2k\x86\qbochs.inf',
            '2k\x86\qbochs.sys',
            'xp\x86\qbochs.inf',
            'xp\x86\qbochs.sys',
            'xp\x64\qbochs.inf',
            'xp\x64\qbochs.sys',
            '2k3\x86\qbochs.inf',
            '2k3\x86\qbochs.sys',
            '2k3\x86\qbochs.cat',
            '2k3\x64\qbochs.inf',
            '2k3\x64\qbochs.sys',
            '2k3\x64\qbochs.cat',
            'license.txt'
          )) {
            if (-not (Test-Path (Join-Path $packageRoot $required))) {
              throw "Signed package tree is missing required file: $required"
            }
          }

          $sourceArchives = @(
            Get-ChildItem -Path (Join-Path $PWD 'output') -Filter 'QBochs-*-source.tar.gz' -File
          )
          if ($sourceArchives.Count -ne 1) {
            throw "Expected exactly one QBochs source archive, found $($sourceArchives.Count)."
          }

          Copy-Item $sourceArchives[0].FullName $signedRoot -Force
          Write-Step 'Signed package tree is ready for Linux release packaging.'

          Write-Step ("Server 2003 signing stage completed in {0:N2}s total." -f $overallTimer.Elapsed.TotalSeconds)
      -
        name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qbochs-signed
          path: signed/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: qbochs-signed
          path: output
      -
        name: Package signed release on Linux
        shell: bash
        run: |
          set -Eeuo pipefail

          package='output/package'
          zipfile='output/QBochs.zip'
          source_archive="output/QBochs-${VERSION}-source.tar.gz"

          command -v zip >/dev/null
          command -v unzip >/dev/null

          test -d "$package/2k"
          test -d "$package/xp"
          test -d "$package/2k3"
          test -f "$package/license.txt"
          test -s "$source_archive"
          tar -tzf "$source_archive" >/dev/null

          for required in \
            2k/x86/qbochs.inf \
            2k/x86/qbochs.sys \
            xp/x86/qbochs.inf \
            xp/x86/qbochs.sys \
            xp/x64/qbochs.inf \
            xp/x64/qbochs.sys \
            2k3/x86/qbochs.inf \
            2k3/x86/qbochs.sys \
            2k3/x86/qbochs.cat \
            2k3/x64/qbochs.inf \
            2k3/x64/qbochs.sys \
            2k3/x64/qbochs.cat; do
            test -f "$package/$required"
          done

          rm -f "$zipfile"

          # Keep final packaging identical to the original Linux build.
          (
            cd "$package"
            zip -9 -q -r "../QBochs.zip" 2k xp 2k3 license.txt
          )

          test -s "$zipfile"
          unzip -t "$zipfile" >/dev/null

          mapfile -t entries < <(unzip -Z1 "$zipfile")
          [ "${#entries[@]}" -gt 0 ]

          for entry in "${entries[@]}"; do
            case "$entry" in
              *\\*|/*|./*|../*|*/../*)
                echo "ERROR: Non-portable ZIP entry: $entry" >&2
                exit 1
                ;;
            esac
          done

          for required in \
            2k/x86/qbochs.inf \
            2k/x86/qbochs.sys \
            xp/x86/qbochs.inf \
            xp/x86/qbochs.sys \
            xp/x64/qbochs.inf \
            xp/x64/qbochs.sys \
            2k3/x86/qbochs.inf \
            2k3/x86/qbochs.sys \
            2k3/x86/qbochs.cat \
            2k3/x64/qbochs.inf \
            2k3/x64/qbochs.sys \
            2k3/x64/qbochs.cat; do
            if ! printf '%s\n' "${entries[@]}" | grep -Fqx -- "$required"; then
              echo "ERROR: QBochs.zip is missing required entry: $required" >&2
              exit 1
            fi
          done

          rm -rf /tmp/qbochs-release-test
          mkdir -p /tmp/qbochs-release-test
          unzip -q "$zipfile" -d /tmp/qbochs-release-test

          test -f /tmp/qbochs-release-test/2k3/x86/qbochs.cat
          test -f /tmp/qbochs-release-test/2k3/x64/qbochs.cat

          rm -rf "$package"

          test -s "$zipfile"
          test -s "$source_archive"
          [ "$(find output -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2 ]
          [ -z "$(find output -mindepth 1 -maxdepth 1 -type d -print -quit)" ]

          echo 'Original Linux ZIP packaging and release validation passed.'
      -
        name: Create a release
        uses: action-pack/github-release@v2
        with:
          tag: "v${{ env.VERSION }}"
          title: "v${{ env.VERSION }}"
          commit: ${{ github.sha }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Add artifacts to release
        uses: AButler/upload-release-assets@v4.0
        with:
          files: 'output/*'
          release-tag: "v${{ env.VERSION }}"
          repo-token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Increment version variable
        uses: action-pack/bump@v2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Send mail
        uses: action-pack/send-mail@v1
        with:
          to: ${{secrets.MAILTO}}
          from: Github Actions <${{secrets.MAILTO}}>
          connection_url: ${{secrets.MAIL_CONNECTION}}
          subject: Build of ${{ github.event.repository.name }} v${{ env.VERSION }} completed
          body: |
              The build job of ${{ github.event.repository.name }} v${{ env.VERSION }} was completed successfully!

              See https://github.com/${{ github.repository }}/actions for more information.
