name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

env:
  VERSION: ${{ vars.MAJOR }}.${{ vars.MINOR }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Set RosBE cache scope
        run: echo "ROSBE_CACHE=$(gcc -march=native -Q --help=target | sha1sum | awk '{print $1}')" >> "$GITHUB_ENV"
      -
        name: Build artifacts
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          provenance: false
          outputs: type=local,dest=output
          platforms: linux/amd64
          cache-from: type=gha,scope=rosbe-${{ env.ROSBE_CACHE }}
          cache-to: type=gha,mode=max,scope=rosbe-${{ env.ROSBE_CACHE }}
          build-args: |
            VERSION_ARG=${{ env.VERSION }}
      -
        name: Upload unsigned artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qbochs-unsigned
          path: output/*
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign Server 2003
    needs: build
    runs-on: windows-2022
    permissions:
      actions: write
      contents: read
    steps:
      -
        name: Download unsigned artifacts
        uses: actions/download-artifact@v8
        with:
          name: qbochs-unsigned
          path: output
      -
        name: Cache Inf2Cat
        id: cache-inf2cat
        uses: actions/cache@v4
        with:
          path: '${{ runner.temp }}\qbochs-inf2cat81'
          key: inf2cat-wdk81-8.100.25984.0-windows-2022-v1
      -
        name: Create and sign Server 2003 catalogs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Join-Path $PWD 'output\QBochs.zip'
          $packageRoot = Join-Path $PWD 'package'

          if (-not (Test-Path $zip)) {
            throw "Missing build artifact: $zip"
          }

          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          Expand-Archive -Path $zip -DestinationPath $packageRoot -Force

          $driverDirs = @(
            (Join-Path $packageRoot '2k3\x86'),
            (Join-Path $packageRoot '2k3\x64')
          )

          foreach ($dir in $driverDirs) {
            $inf = Join-Path $dir 'qbochs.inf'
            $sys = Join-Path $dir 'qbochs.sys'

            if (-not (Test-Path $inf) -or -not (Test-Path $sys)) {
              throw "Incomplete Server 2003 driver package: $dir"
            }

            $text = Get-Content -Path $inf -Raw
            if ($text -notmatch '(?im)^\s*CatalogFile\s*=') {
              $text = $text -replace '(?m)^(DriverVer\s*=.*)$', "`$1`r`nCatalogFile = qbochs.cat"
              Set-Content -Path $inf -Value $text -Encoding ASCII
            }
          }

          function Test-Inf2Cat {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path
            )

            $testDir = Join-Path $packageRoot '2k3\x64'
            $cat = Join-Path $testDir 'qbochs.cat'
            Remove-Item $cat -Force -ErrorAction SilentlyContinue

            try {
              Write-Host "Trying Inf2Cat: $Path"
              & $Path "/driver:$testDir" '/os:Server2003_X64' '/uselocaltime' '/verbose'
              return ($LASTEXITCODE -eq 0 -and (Test-Path $cat))
            }
            catch {
              Write-Warning "Inf2Cat test failed: $($_.Exception.Message)"
              return $false
            }
            finally {
              Remove-Item $cat -Force -ErrorAction SilentlyContinue
            }
          }

          function Test-Inf2CatToolset {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Directory
            )

            foreach ($file in @(
              'Inf2Cat.exe',
              'inf2cat.exe.manifest',
              'Microsoft.Whos.Shared.IO.Cabinets.dll',
              'Microsoft.Whos.Shared.IO.Catalogs.dll',
              'Microsoft.Whos.Shared.Xml.InfReader.dll',
              'Microsoft.Whos.Winqual.Submissions.SubmissionBuilder.dll',
              'Microsoft.Whos.Xml.NonXmlDataReader.dll',
              'WindowsProtectedFiles.xml'
            )) {
              if (-not (Test-Path (Join-Path $Directory $file))) {
                Write-Host "Inf2Cat cache is missing $file"
                return $false
              }
            }

            return Test-Inf2Cat -Path (Join-Path $Directory 'Inf2Cat.exe')
          }

          $inf2catCache = Join-Path $env:RUNNER_TEMP 'qbochs-inf2cat81'

          if (-not (Test-Inf2CatToolset -Directory $inf2catCache)) {
            Write-Host 'Cached Inf2Cat is unavailable; downloading the Windows Driver Kit 8.1 layout.'

            if (Test-Path $inf2catCache) {
              Remove-Item $inf2catCache -Recurse -Force
            }
            New-Item -ItemType Directory -Path $inf2catCache | Out-Null

            $wdkRoot = Join-Path $env:RUNNER_TEMP 'wdk81'
            $wdkLayout = Join-Path $wdkRoot 'layout'
            $wdkExtract = Join-Path $wdkRoot 'extract'
            $wdkSetup = Join-Path $wdkRoot 'wdksetup.exe'
            $wdkSetupUrl = 'https://download.microsoft.com/download/8/6/9/86925F0F-D57A-4BA4-8278-861B6876D78E/wdk/wdksetup.exe'

            if (Test-Path $wdkRoot) {
              Remove-Item $wdkRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Path $wdkRoot, $wdkLayout, $wdkExtract | Out-Null

            Write-Host 'Downloading the Windows Driver Kit 8.1 bootstrapper.'
            Invoke-WebRequest `
              -Uri $wdkSetupUrl `
              -OutFile $wdkSetup `
              -UseBasicParsing

            Write-Host 'Downloading the Windows Driver Kit 8.1 layout.'
            $layout = Start-Process `
              -FilePath $wdkSetup `
              -ArgumentList @(
                '/layout',
                "`"$wdkLayout`"",
                '/quiet',
                '/norestart'
              ) `
              -Wait `
              -PassThru

            if ($layout.ExitCode -ne 0) {
              throw "Windows Driver Kit 8.1 layout failed with exit code $($layout.ExitCode)."
            }

            $preferredMsis = @(
              'Windows Driver Kit Binaries-x86_en-us.msi',
              'Windows Driver Kit-x86_en-us.msi'
            )

            $extractedInf2Cat = $null

            foreach ($msiName in $preferredMsis) {
              $msi = Get-ChildItem `
                -Path $wdkLayout `
                -Filter $msiName `
                -File `
                -Recurse |
                Select-Object -First 1

              if (-not $msi) {
                Write-Host "WDK layout does not contain $msiName"
                continue
              }

              $extractDir = Join-Path $wdkExtract ([System.IO.Path]::GetFileNameWithoutExtension($msi.Name))
              New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

              Write-Host "Extracting $($msi.Name) without installing the WDK."
              $adminInstall = Start-Process `
                -FilePath msiexec.exe `
                -ArgumentList @(
                  '/a',
                  "`"$($msi.FullName)`"",
                  '/qn',
                  "TARGETDIR=`"$extractDir`""
                ) `
                -Wait `
                -PassThru

              if ($adminInstall.ExitCode -ne 0) {
                Write-Warning "$($msi.Name) extraction failed with exit code $($adminInstall.ExitCode)."
                continue
              }

              $extractedInf2Cat = Get-ChildItem `
                -Path $extractDir `
                -Filter Inf2Cat.exe `
                -File `
                -Recurse |
                Select-Object -First 1

              if ($extractedInf2Cat) {
                break
              }
            }

            if (-not $extractedInf2Cat) {
              throw 'Inf2Cat.exe was not found in the Windows Driver Kit 8.1 packages.'
            }

            $inf2catDir = Split-Path -Parent $extractedInf2Cat.FullName
            Copy-Item (Join-Path $inf2catDir '*') $inf2catCache -Recurse -Force

            if (-not (Test-Inf2CatToolset -Directory $inf2catCache)) {
              throw 'Extracted Windows Driver Kit 8.1 Inf2Cat toolset is incomplete or unusable.'
            }
          }
          else {
            Write-Host 'Using cached Windows Driver Kit 8.1 Inf2Cat toolset.'
          }

          $inf2cat = Join-Path $inf2catCache 'Inf2Cat.exe'
          Write-Host "Using Inf2Cat: $inf2cat"

          & $inf2cat "/driver:$($driverDirs[0])" '/os:Server2003_X86' '/uselocaltime' '/verbose'
          if ($LASTEXITCODE -ne 0) {
            throw 'Inf2Cat failed for Server 2003 x86.'
          }

          & $inf2cat "/driver:$($driverDirs[1])" '/os:Server2003_X64' '/uselocaltime' '/verbose'
          if ($LASTEXITCODE -ne 0) {
            throw 'Inf2Cat failed for Server 2003 x64.'
          }

          foreach ($dir in $driverDirs) {
            if (-not (Test-Path (Join-Path $dir 'qbochs.cat'))) {
              throw "Inf2Cat did not create qbochs.cat in $dir"
            }
          }

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=QBochs Project' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA1 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddYears(20)

          if (-not $cert) {
            throw 'Failed to create the QBochs signing certificate.'
          }

          $cer = Join-Path $env:RUNNER_TEMP 'qbochs.cer'
          Export-Certificate -Cert $cert -FilePath $cer -Type CERT | Out-Null

          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null

          $signTool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits", "$env:ProgramFiles\Windows Kits" `
            -Filter signtool.exe `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signTool) {
            throw 'SignTool.exe was not found.'
          }

          Write-Host "Using SignTool: $signTool"

          foreach ($dir in $driverDirs) {
            $cat = Join-Path $dir 'qbochs.cat'
            $inf = Join-Path $dir 'qbochs.inf'
            $sys = Join-Path $dir 'qbochs.sys'

            & $signTool sign /v /fd SHA1 /s My /sha1 $cert.Thumbprint $cat
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool failed to sign $cat"
            }

            Copy-Item $cer (Join-Path $dir 'qbochs.cer') -Force

            & $signTool verify /pa /v /c $cat $inf
            if ($LASTEXITCODE -ne 0) {
              throw "Catalog verification failed for $inf"
            }

            & $signTool verify /pa /v /c $cat $sys
            if ($LASTEXITCODE -ne 0) {
              throw "Catalog verification failed for $sys"
            }
          }

          Remove-Item $zip -Force
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zip -CompressionLevel Optimal

          foreach ($dir in $driverDirs) {
            foreach ($file in 'qbochs.inf', 'qbochs.sys', 'qbochs.cat', 'qbochs.cer') {
              if (-not (Test-Path (Join-Path $dir $file))) {
                throw "Signed package is missing $file in $dir"
              }
            }
          }
      -
        name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qbochs-signed
          path: output/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      -
        name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: qbochs-signed
          path: output
      -
        name: Create a release
        uses: action-pack/github-release@v2
        with:
          tag: "v${{ env.VERSION }}"
          title: "v${{ env.VERSION }}"
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Add artifacts to release
        uses: AButler/upload-release-assets@v4.0
        with:
          files: 'output/*'
          release-tag: "v${{ env.VERSION }}"
          repo-token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Increment version variable
        uses: action-pack/bump@v2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Send mail
        uses: action-pack/send-mail@v1
        with:
          to: ${{secrets.MAILTO}}
          from: Github Actions <${{secrets.MAILTO}}>
          connection_url: ${{secrets.MAIL_CONNECTION}}
          subject: Build of ${{ github.event.repository.name }} v${{ env.VERSION }} completed
          body: |
              The build job of ${{ github.event.repository.name }} v${{ env.VERSION }} was completed successfully!

              See https://github.com/${{ github.repository }}/actions for more information.
